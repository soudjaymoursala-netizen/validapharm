name: Déploiement GitHub Pages (hébergement PWA — SDS §…, AR-R-62 clos)

# Se déclenche uniquement après succès du portail de qualité sur main
# ("Quality gate", quality-gate.yml) — jamais un déploiement direct non
# vérifié, conformément à 22-SDS-outil.md.
on:
  workflow_run:
    workflows: ['Quality gate (SDS §4 — répond à URS-REG-004)']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (base path GitHub Pages)
        run: npm run build
        env:
          BASE_PATH: /validapharm/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
