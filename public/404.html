<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>ValidaPharm</title>
    <!--
      GitHub Pages ne réécrit aucune route côté serveur, or Vue Router est
      en mode history (createWebHistory) : un accès direct ou un rafraîchissement
      sur une route autre que "/" renverrait ce vrai 404.html de GitHub Pages.
      Ce script encode le chemin demandé en query string puis redirige vers
      index.html, qui le décode (voir index.html) — pattern standard
      rafgraph/spa-github-pages, pathSegmentsToKeep=1 car project page
      (https://<owner>.github.io/validapharm/).
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
