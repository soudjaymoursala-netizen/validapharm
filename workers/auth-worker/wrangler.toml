# Configuration Cloudflare Workers. Base D1 réelle créée et
# migrée le 04/09/2026 via le connecteur MCP Cloudflare Developer Platform
# (`d1_database_create` + migration 0001 appliquée statement par statement,
# `d1_database_query`) — plus un identifiant fictif à générer soi-même.
# Reste à la charge de l'utilisateur (aucun outil MCP disponible pour ces
# étapes, voir README.md) : déployer le code du Worker (`wrangler deploy`)
# et configurer les secrets (`wrangler secret put`).

name = "validapharm-auth-worker"
main = "src/index.ts"
compatibility_date = "2026-08-25"

[[d1_databases]]
binding = "DB"
database_name = "validapharm-auth"
database_id = "5fb762ef-fe99-4e68-9086-e57126c5c2aa"

# Bucket R2 créé le 11/09/2026 via le connecteur MCP Cloudflare Developer
# Platform (`r2_bucket_create`) — contenu volumineux des documents
# normatifs (texte extrait + fichier binaire d'origine), jamais en D1
# (voir migration 0003_documents_normatifs.sql).
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "validapharm-normes"

# Variables non secrètes (le secret RESEND_API_KEY se pose via
# `wrangler secret put`, jamais ici). RESEND_FROM reste sur le domaine
# partagé de Resend tant qu'aucun domaine propre n'est vérifié — n'envoie
# alors que vers l'adresse du compte Resend lui-même, jamais vers de vrais
# utilisateurs (limite du service, pas de l'outil). Basculer vers une
# adresse @votredomaine.com dès qu'un domaine est vérifié dans Resend.
[vars]
RESEND_FROM = "onboarding@resend.dev"
APP_URL = "https://validapharm.pages.dev"
