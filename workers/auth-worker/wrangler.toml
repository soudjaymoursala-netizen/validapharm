# Configuration Cloudflare Workers (TD-046). Base D1 réelle créée et
# migrée le 04/09/2026 via le connecteur MCP Cloudflare Developer Platform
# (`d1_database_create` + migration 0001 appliquée statement par statement,
# `d1_database_query`) — plus un identifiant fictif à générer soi-même.
# Reste à la charge de l'utilisateur (aucun outil MCP disponible pour ces
# étapes, voir README.md) : déployer le code du Worker (`wrangler deploy`)
# et configurer les secrets (`wrangler secret put`).

name = "validapharm-auth-worker"
main = "src/index.ts"
compatibility_date = "2026-08-25"

[[d1_databases]]
binding = "DB"
database_name = "validapharm-auth"
database_id = "5fb762ef-fe99-4e68-9086-e57126c5c2aa"
